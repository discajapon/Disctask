# Included inside the discajapon.com server block. /api/ is already taken by another app on this
# host, so Disctask lives under /disctask/: API /disctask/api/*, MCP https://discajapon.com/disctask/mcp
location ^~ /disctask/ {
    limit_req zone=disctask burst=30 nodelay;
    client_max_body_size 5m;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:8770/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
