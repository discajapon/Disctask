<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Disctask</title>
<style>
@font-face{font-family:AS;src:local("Anthropic Serif Text"),url(fonts/AnthropicSerif-Text-Regular-Static.otf)}
@font-face{font-family:AS;font-style:italic;src:local("Anthropic Serif Text Italic"),url(fonts/AnthropicSerif-Text-RegularItalic-Static.otf)}
@font-face{font-family:AS;font-weight:500;src:local("Anthropic Serif Text Medium"),url(fonts/AnthropicSerif-Text-Medium-Static.otf)}
@font-face{font-family:AS;font-weight:600;src:local("Anthropic Serif Text Semibold"),url(fonts/AnthropicSerif-Text-Semibold-Static.otf)}
@font-face{font-family:AS;font-weight:700;src:local("Anthropic Serif Text Bold"),url(fonts/AnthropicSerif-Text-Bold-Static.otf)}
@font-face{font-family:ASD;font-weight:600;src:local("Anthropic Serif Display Semibold"),url(fonts/AnthropicSerif-Display-Semibold-Static.otf)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px AS,Georgia,serif;color:#fff;display:grid;place-items:center;
 background:#1b1340 url(bg.jpg) center/cover fixed}
.glass{position:relative;overflow:hidden;
 background:linear-gradient(135deg,rgba(30,20,50,.55),rgba(30,20,50,.35));
 backdrop-filter:blur(28px) saturate(200%) brightness(.9);-webkit-backdrop-filter:blur(28px) saturate(200%) brightness(.9);
 border:1.5px solid rgba(255,255,255,.55);border-radius:32px;
 box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.7),inset 0 -2px 6px rgba(255,255,255,.2),inset 0 0 40px rgba(255,255,255,.08);
 animation:float 6s ease-in-out infinite}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.35),transparent 60%);transition:background .15s}
.glass::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:sheen 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.94)}}
main{width:min(440px,92vw);padding:24px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
h1{margin:0 0 4px;font:600 2em ASD,AS,Georgia,serif;letter-spacing:-.01em}
nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
nav span{flex:1;text-align:center;opacity:.85}
button,input{font:inherit;color:inherit}
button{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);border-radius:14px;padding:6px 12px;cursor:pointer;box-shadow:inset 0 1px 1px rgba(255,255,255,.5);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s,box-shadow .25s}
button:hover{background:rgba(255,255,255,.38);transform:translateY(-2px) scale(1.08);box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.7)}
button:active{transform:scale(.9)}
form{display:flex;gap:8px;margin-bottom:12px}
input[type=text]{flex:1;padding:10px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);outline:none;transition:box-shadow .3s,background .3s}
input[type=text]:focus{background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 24px rgba(255,255,255,.35)}
input::placeholder{color:rgba(255,255,255,.6)}
li{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px;border-radius:18px;
 background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.3);animation:pop .4s cubic-bezier(.34,1.56,.64,1);transition:transform .25s,background .25s}
li:hover{transform:translateX(4px);background:rgba(255,255,255,.18)}
li{user-select:none;-webkit-user-select:none;cursor:grab}
li.lift{opacity:.45}
.tg{position:fixed;z-index:20;pointer-events:none;max-width:260px;padding:8px 14px;border-radius:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 background:linear-gradient(135deg,rgba(255,255,255,.45),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.75);
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.8);
 text-shadow:0 1px 3px rgba(0,0,0,.6);rotate:-2deg;scale:1.04}
li label{flex:1;cursor:pointer}
li label{transition:opacity .3s}
li.done label{text-decoration:line-through;opacity:.6}
ul{padding:0;margin:0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:50%;cursor:pointer;position:relative;
 background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.08));border:1.5px solid rgba(255,255,255,.6);
 box-shadow:inset 0 2px 2px rgba(255,255,255,.7),inset 0 -2px 4px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.3);
 backdrop-filter:blur(6px);transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .35s,box-shadow .35s,border-color .35s}
input[type=checkbox]:hover{transform:scale(1.15)}
input[type=checkbox]:active{transform:scale(.85)}
input[type=checkbox]:checked{animation:bounce .5s cubic-bezier(.34,1.56,.64,1);border-color:rgba(190,255,210,.9);
 background:linear-gradient(135deg,rgba(80,230,130,.85),rgba(20,160,80,.6));
 box-shadow:inset 0 2px 2px rgba(255,255,255,.8),inset 0 -3px 6px rgba(0,120,50,.5),0 0 18px rgba(60,230,120,.8)}
input[type=checkbox]::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;
 transform:rotate(45deg) scale(0);filter:drop-shadow(0 1px 2px rgba(0,80,30,.6));transition:transform .35s cubic-bezier(.34,1.56,.64,1) .1s}
input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
@keyframes bounce{40%{transform:scale(1.3)}}
.x{padding:2px 9px}
.wrap{display:flex;align-items:center;justify-content:center;padding:24px 16px}
main>header{display:flex;align-items:center;justify-content:space-between;gap:8px}
#cb.on{background:rgba(255,255,255,.45);box-shadow:0 0 18px rgba(255,255,255,.45),inset 0 1px 1px rgba(255,255,255,.8)}
:root{--h:44px;--cw:min(760px,calc(100vw - 540px))}
#cal{flex:none;width:0;height:min(720px,calc(100vh - 48px));opacity:0;border-width:0;scale:.92;translate:-40px 0;pointer-events:none;
 transition:width .7s cubic-bezier(.34,1.25,.64,1),margin .7s cubic-bezier(.34,1.25,.64,1),opacity .45s,scale .7s cubic-bezier(.34,1.56,.64,1),translate .7s cubic-bezier(.34,1.56,.64,1)}
.wrap.cal #cal{width:var(--cw);margin-left:20px;opacity:1;border-width:1.5px;scale:1;translate:0;pointer-events:auto}
.ci{width:var(--cw);height:100%;padding:20px;display:flex;flex-direction:column;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.wh,.grid{display:grid;grid-template-columns:46px repeat(7,1fr)}
.wh{padding-right:8px}
.wh button{margin:0 3px 8px;padding:4px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;line-height:1.2;font-size:.78em;text-transform:capitalize}
.wh b{font-size:1.4em;font-weight:600}
.wh .today b{text-shadow:0 0 12px rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.6)}
.wh .sel{background:rgba(255,255,255,.42);box-shadow:0 0 16px rgba(255,255,255,.35),inset 0 1px 1px rgba(255,255,255,.8)}
.sc{flex:1;overflow-y:auto;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.25)}
.sc::-webkit-scrollbar{width:8px}.sc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:8px}
.grid{position:relative;height:calc(24*var(--h))}
.hrs{position:relative;font-size:.68em;opacity:.7}
.hrs span{position:absolute;right:6px;translate:0 -50%}
.col{position:relative;border-left:1px solid rgba(255,255,255,.12);cursor:crosshair;
 background:repeating-linear-gradient(to bottom,rgba(255,255,255,.13) 0 1px,transparent 1px var(--h))}
.col.today{background-color:rgba(255,255,255,.07)}
.now{position:absolute;left:0;right:0;height:2px;z-index:3;pointer-events:none;background:#ff9ec4;box-shadow:0 0 10px #ff9ec4}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:inherit;box-shadow:inherit;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{scale:1.5}}
.grid{user-select:none;-webkit-user-select:none}
.ev{position:absolute;left:3px;right:3px;z-index:2;padding:4px 7px;border-radius:12px;overflow:hidden;cursor:grab;font-size:.74em;line-height:1.25;
 background:linear-gradient(135deg,rgba(var(--c),.55),rgba(var(--c),.22));border:1px solid rgba(var(--c),.9);
 backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 4px 14px rgba(0,0,0,.25);
 transition:box-shadow .25s,scale .25s cubic-bezier(.34,1.56,.64,1),filter .25s,top .12s,height .12s,left .35s cubic-bezier(.34,1.3,.64,1),width .35s cubic-bezier(.34,1.3,.64,1)}
.ev:hover{filter:brightness(1.15);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 6px 20px rgba(0,0,0,.35),0 0 16px rgba(var(--c),.6)}
.ev{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.ev a,#ep a{color:#d6ecff;text-decoration:underline;text-underline-offset:2px;cursor:pointer;transition:color .2s,text-shadow .2s}
.ev a:hover,#ep a:hover{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.9)}
#ep{margin:-4px 0 0;padding:0 4px;font-size:.9em;white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto}
#ep:empty{display:none}
.ev.drag{cursor:grabbing;scale:1.04;z-index:5;filter:brightness(1.15);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 14px 30px rgba(0,0,0,.45),0 0 22px rgba(var(--c),.7)}
.sp{position:absolute;z-index:4;pointer-events:none;padding:4px 7px;border-radius:12px;font-size:.74em;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
 background:rgba(var(--c),.35);border:2px dashed rgba(var(--c),1);box-shadow:0 0 18px rgba(var(--c),.6),inset 0 1px 1px rgba(255,255,255,.6)}
.ev i{position:absolute;left:0;right:0;height:8px;cursor:ns-resize;z-index:1}
.ev .rt{top:0}.ev .rb{bottom:0}
.ev .rl,.ev .rr{top:8px;bottom:8px;height:auto;width:8px;cursor:ew-resize}
.ev .rl{left:0;right:auto}.ev .rr{right:0;left:auto}
.ev i::after{content:"";position:absolute;left:50%;width:24px;height:3px;translate:-50% 0;border-radius:3px;background:rgba(255,255,255,.8);opacity:0;transition:opacity .2s}
.ev .rt::after{top:2px}.ev .rb::after{bottom:2px}
.ev .rl::after,.ev .rr::after{left:auto;top:50%;width:3px;height:24px;translate:0 -50%}
.ev .rl::after{left:2px}.ev .rr::after{right:2px}
.ev:hover i::after,.ev.drag i::after{opacity:1}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{opacity:.85}
.ev p{margin:3px 0 0;opacity:.92;white-space:pre-wrap;overflow-wrap:anywhere}
dialog.glass{position:fixed;width:min(420px,92vw);padding:22px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
dialog::backdrop{background:rgba(15,8,40,.35);backdrop-filter:blur(3px)}
#ef,#sf{flex-direction:column;gap:12px;margin:0}
#ef .row,#sf .row{display:flex;align-items:center;gap:8px}
#ef input,#ef textarea,#sf input{font:inherit;color:inherit;padding:8px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);outline:none;color-scheme:dark;transition:box-shadow .3s,background .3s}
#ef input:focus,#ef textarea:focus,#sf input:focus{background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 24px rgba(255,255,255,.35)}
#cal .ev{touch-action:none} /* touch: events move/resize instead of scrolling the page */
#sc{touch-action:pan-y}
#ss{font-size:12px;padding:3px 10px;margin-left:auto}
#et{font-size:1.2em;font-weight:600}
#es{display:flex;flex-wrap:wrap;gap:8px}
#es input{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin:0;border-radius:50%;cursor:pointer;
 background:linear-gradient(135deg,rgba(var(--c),.75),rgba(var(--c),.3));border:1.5px solid rgba(var(--c),1);
 box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 2px 8px rgba(0,0,0,.3);transition:scale .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
#es input:hover{scale:1.15}
#es input:checked{scale:1.2;box-shadow:inset 0 2px 2px rgba(255,255,255,.8),0 0 0 2px #fff,0 0 16px rgba(var(--c),.9)}
#ex{resize:vertical;min-height:80px}
#ef input[type=time]{flex:1}
html.idle *,html.idle *::before,html.idle *::after{animation-play-state:paused!important} /* no frames while nobody is looking */
@media(max-width:900px){:root{--cw:min(760px,92vw)}.wrap{flex-direction:column}#cal{height:0;transition-property:height,margin,opacity,scale,translate}.wrap.cal #cal{margin:20px 0 0;height:min(720px,85vh)}}
</style>
<div class=wrap id=w>
<main class="glass">
<header><h1>Disctask</h1><button id=ss title="Sincronización"></button><button id=cb title="Calendario">🗓</button></header>
<nav><button id=py title="Año anterior">«</button><button id=p>‹</button><span id=d></span><button id=n>›</button><button id=ny title="Año siguiente">»</button></nav>
<form id=f><input type=text id=t placeholder="Nueva tarea…" autofocus autocomplete=off><button>＋</button></form>
<ul id=l></ul>
<button id=e style="width:100%;margin-top:8px">⬇ Exportar notas</button>
</main>
<aside id=cal class=glass><div class=ci>
 <nav><button id=wp title="Semana anterior">‹</button><span id=wl></span><button id=wt>Hoy</button><button id=wn title="Semana siguiente">›</button></nav>
 <div class=wh id=wh></div>
 <div class=sc id=sc><div class=grid id=g><div class=hrs></div></div></div>
</div></aside>
</div>
<dialog id=sdlg class=glass><form method=dialog id=sf>
 <input type=text id=su placeholder="Servidor" autocomplete=off>
 <input type=password id=st placeholder="Token de dispositivo (vacío = solo local)" autocomplete=off>
 <div class=row><span style=flex:1></span><button type=button id=scan>Cancelar</button><button value=ok>Guardar</button></div>
</form></dialog>
<dialog id=dlg class=glass><form method=dialog id=ef>
 <input type=text id=et placeholder="Título" autocomplete=off>
 <div id=es></div>
 <div class=row><input type=date id=ed max=2040-12-31><input type=time id=e1 step=900><span>–</span><input type=time id=e2 step=900></div>
 <textarea id=ex placeholder="Descripción — los enlaces (https://… o www.…) se pueden pulsar"></textarea>
 <p id=ep></p>
 <div class=row><button type=button id=edel>🗑 Eliminar</button><span style=flex:1></span><button type=button id=ecan>Cancelar</button><button value=ok>Guardar</button></div>
</form></dialog>
<script>
const $=i=>document.getElementById(i);
let day=new Date().toLocaleDateString('sv'); // YYYY-MM-DD local
const load=(k,empty,ok)=>{const raw=localStorage[k];if(!raw)return empty;
 try{const v=JSON.parse(raw);if(ok(v))return v}catch{}
 try{localStorage[k+'-corrupt']=raw}catch{} // never overwrite unreadable data without keeping a copy
 return empty};
const put=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch(e){console.error('save failed',e)}};
const plain=v=>v&&typeof v=='object'&&!Array.isArray(v);
let db=load('disctask',{},plain);
for(const d in db)if(!Array.isArray(db[d]))delete db[d];
const save=()=>{reconcile();put('disctask',db);queue()};
const MAX='2040-12-31';
const shift=(n,y)=>{const x=new Date(day+'T12:00');y?x.setFullYear(x.getFullYear()+n):x.setDate(x.getDate()+n);
 const v=x.toLocaleDateString('sv');if(v<=MAX){day=v;render()}};
function render(){
 $('d').textContent=new Date(day+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('n').disabled=$('ny').disabled=day>='2040-12-31'||undefined;
 const a=db[day]||[];
 $('l').innerHTML='';
 a.forEach((k,i)=>{const li=document.createElement('li');li.className=k.done?'done':'';
  li.innerHTML='<input type=checkbox id=c'+i+'><label for=c'+i+'></label><button class=x>✕</button>';
  li.querySelector('label').textContent=k.text;
  li.onpointerdown=e=>taskDown(e,k,li);
  const c=li.querySelector('input');c.checked=k.done;
  c.onchange=()=>{k.done=c.checked;save();render()};
  li.querySelector('.x').onclick=()=>{a.splice(i,1);save();render()};
  $('l').append(li)});
 renderCal()}
$('f').onsubmit=e=>{e.preventDefault();const s=$('t').value.trim();if(!s)return;
 (db[day]??=[]).push({text:s,done:false});$('t').value='';save();render()};
$('p').onclick=()=>shift(-1);$('n').onclick=()=>shift(1);$('py').onclick=()=>shift(-1,1);$('ny').onclick=()=>shift(1,1);
$('e').onclick=()=>{const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({tareas:db,horarios:ev},null,2)],{type:'application/json'}));
 a.download='disctask-notas.json';a.click()};
const H=44,iso=d=>d.toLocaleDateString('sv'); // H must match --h
const week=()=>{const m=new Date(day+'T12:00');m.setDate(m.getDate()-(m.getDay()+6)%7);
 return[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return iso(d)})};
document.querySelector('.hrs').innerHTML=[...Array(23)].map((_,i)=>`<span style="top:${(i+1)*H}px">${i+1}:00</span>`).join('');
for(let i=0;i<7;i++)$('g').append(Object.assign(document.createElement('div'),{className:'col'}));
function renderCal(){
 const ds=week(),today=iso(new Date());
 $('wh').innerHTML='<i></i>'+ds.map(d=>{const x=new Date(d+'T12:00');
  return`<button data-d=${d} class="${d==today?'today':''} ${d==day?'sel':''}">${x.toLocaleDateString('es',{weekday:'short'})}<b>${x.getDate()}</b></button>`}).join('');
 const f=o=>new Date(o+'T12:00').toLocaleDateString('es',o==ds[6]?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'});
 $('wl').textContent=f(ds[0])+' – '+f(ds[6]);
 $('wn').disabled=ds[6]>=MAX||undefined;
 document.querySelectorAll('.col').forEach((c,i)=>{c.dataset.d=ds[i];c.classList.toggle('today',ds[i]==today)});
 nowLine();renderEv()}
$('wp').onclick=()=>shift(-7);$('wn').onclick=()=>shift(7);$('wt').onclick=()=>{day=iso(new Date());render()};
const normEv=k=>k&&typeof k.date=='string'&&Number.isFinite(k.start)&&Number.isFinite(k.end)&&k.end>k.start&&
 {id:String(k.id??Math.random().toString(36).slice(2)),date:k.date,start:k.start,end:Math.min(k.end,1440),title:String(k.title??''),color:String(k.color??''),desc:String(k.desc??'')};
let ev=load('disctask-cal',[],Array.isArray).map(normEv).filter(Boolean);
const saveEv=()=>{reconcile();put('disctask-cal',ev);queue()};
const uid=()=>crypto.randomUUID?.()??Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const hm=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const linkify=s=>s.split(/((?:https?:\/\/|\bwww\.)\S*[^\s.,;:!?)\]'"])/i).map((p,i)=>i%2
 ?`<a href="${esc(/^www\./i.test(p)?'https://'+p:p)}" target=_blank rel=noopener>${esc(p)}</a>`:esc(p)).join('');
function lanes(list){ // overlapping events share the column side by side: k -> [lane, lanes]
 const out=new Map();let group=[],end=-1;
 const flush=()=>{const ends=[];for(const k of group){let i=ends.findIndex(x=>x<=k.start);if(i<0)i=ends.length;ends[i]=k.end;out.set(k,i)}
  for(const k of group)out.set(k,[out.get(k),ends.length]);group=[]};
 for(const k of [...list].sort((a,b)=>a.start-b.start||b.end-a.end)){if(k.start>=end)flush();group.push(k);end=Math.max(end,k.end)}
 flush();return out}
function renderEv(){ // updates blocks in place so drags don't restart animations
 const old=new Map([...document.querySelectorAll('.ev')].map(e=>[e.dataset.id,e]));
 document.querySelectorAll('.col').forEach(c=>{const L=lanes(ev.filter(k=>k.date==c.dataset.d));L.forEach(([i,n],k)=>{
  let el=old.get(k.id);old.delete(k.id);
  if(!el){el=document.createElement('div');el.className='ev';el.dataset.id=k.id;el.innerHTML='<i class=rt></i><i class=rl></i><i class=rr></i><b></b><small></small><p></p><i class=rb></i>'}
  el.style.cssText=`top:${k.start*H/60}px;height:${(k.end-k.start)*H/60}px;--c:${k.color};left:calc(3px + (100% - 6px)*${i/n});width:calc((100% - 6px)/${n} - ${n>1?2:0}px)`;
  el.querySelector('b').textContent=k.title||'(sin título)';
  el.querySelector('small').textContent=hm(k.start)+' – '+hm(k.end);
